version: "3.9"

services:
  app:
    build:
      context: ./src  # Aponta para o diretório src onde está o Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=info
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  logs:
    driver: local
