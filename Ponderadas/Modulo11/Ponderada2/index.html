<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WebSocket Camera Stream</title>
    <script>
        var socket;

        function logMessage(message) {
            const log = document.getElementById("log");
            const p = document.createElement("p");
            p.innerText = message;
            log.appendChild(p);
        }

        function connectWebSocket() {
            logMessage("Tentando conectar ao WebSocket...");
            
            // IP do ESP32 alterado para 10.254.19.9
            socket = new WebSocket('ws://10.128.0.118:81');

            socket.onopen = function() {
                logMessage("Conectado ao WebSocket com sucesso!");
            };

            socket.onmessage = function(event) {
                const img = document.getElementById("cameraImage");
                // Converter o binário recebido para uma imagem Base64 e exibir
                var reader = new FileReader();
                reader.readAsDataURL(new Blob([event.data]));
                reader.onloadend = function() {
                    img.src = reader.result;
                };
            };

            socket.onerror = function(error) {
                logMessage("Erro no WebSocket: " + error.message);
                console.error("WebSocket error:", error);
            };

            socket.onclose = function() {
                logMessage("Desconectado do WebSocket.");
            };
        }
    </script>
</head>
<body>
    <h1>ESP32 WebSocket Video Stream</h1>
    <button onclick="connectWebSocket()">Conectar ao WebSocket</button>
    <br>
    <!-- Removido o botão de "Capturar Imagem", já que os frames serão enviados continuamente -->
    <br>
    <img id="cameraImage" alt="Imagem da câmera aparecerá aqui" style="width: 320px; height: 240px;">
    
    <h2>Log de Eventos</h2>
    <div id="log" style="border:1px solid #000; padding:10px; max-height:300px; overflow:auto;"></div>
</body>
</html>
